<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ball 8 | Bingo Gold</title>
  
  <meta name="google-site-verification" content="google092df57e55a7cdc3-2" />

  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold: #FFD700;
      --gold2: #FFA500;
      --dark: #0a0a1a;
      --card-bg: #13132a;
      --marked: #FFD700;
      --free: #ff4d6d;
      --accent: #7b2fff;
      --green: #22c55e;
      --coin: #fbbf24;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--dark);
      font-family: 'Nunito', sans-serif;
      color: #fff;
      min-height: 100vh;
      overflow-x: hidden;
      background-image:
        radial-gradient(ellipse at 20% 20%, #1a0a3a 0%, transparent 50%),
        radial-gradient(ellipse at 80% 80%, #0a1a3a 0%, transparent 50%);
    }

    header { text-align: center; padding: 2rem 1rem 0.5rem; }

    .title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(3rem, 8vw, 6rem);
      background: linear-gradient(135deg, var(--gold), var(--gold2), #fff8, var(--gold));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: 4px;
      filter: drop-shadow(0 0 30px #ffd70055);
    }

    .subtitle {
      color: #aaa;
      font-size: 0.9rem;
      margin-top: -0.3rem;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .coins-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 1rem;
      margin: 1rem auto;
      background: #ffffff0d;
      border: 1px solid #ffffff15;
      border-radius: 50px;
      padding: 0.6rem 2rem;
      width: fit-content;
      font-size: 1.2rem;
      font-weight: 800;
      backdrop-filter: blur(10px);
    }

    .coin-icon { font-size: 1.5rem; animation: spin 3s linear infinite; }
    @keyframes spin { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }

    .coins-amount {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2rem;
      color: var(--gold);
      letter-spacing: 2px;
    }

    .game-area {
      display: flex;
      flex-wrap: wrap;
      gap: 2rem;
      justify-content: center;
      padding: 0 1rem 3rem;
      align-items: flex-start;
    }

    .bingo-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      background: #ffffff08;
      border: 1px solid #ffffff15;
      border-radius: 16px;
      padding: 12px;
      max-width: 340px;
      width: 100%;
    }

    .cell {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      font-weight: 800;
      font-size: 1.1rem;
      cursor: pointer;
      background: var(--card-bg);
      border: 2px solid #ffffff15;
      transition: all 0.2s ease;
    }

    .cell.marked { background: linear-gradient(135deg, #7b2fff, #4361ee); color: white; }
    .cell.free { background: var(--free); color: white; font-size: 0.75rem; }

    .right-panel { display: flex; flex-direction: column; gap: 1.5rem; min-width: 220px; }

    .drawn-ball {
      width: 100px; height: 100px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), #4361ee);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2.8rem;
      border: 3px solid #ffffff30;
      box-shadow: 0 0 30px #7b2fff88;
    }

    .btn {
      padding: 0.8rem;
      border: none;
      border-radius: 12px;
      font-family: 'Nunito', sans-serif;
      font-weight: 800;
      cursor: pointer;
      text-transform: uppercase;
    }

    .btn-gold { background: linear-gradient(135deg, var(--gold), var(--gold2)); color: #000; }

    /* DEV PANEL STYLE */
    .dev-toggle { position: fixed; bottom: 10px; right: 10px; font-size: 10px; opacity: 0.5; cursor: pointer; }
  </style>
</head>
<body>

<header>
  <div class="title">BINGO GOLD</div>
  <div class="subtitle">English Edition • Luck & Glory</div>
</header>

<div class="coins-bar">
  <span class="coin-icon">🪙</span>
  <span class="coins-amount" id="coins">20</span>
  <span style="color:#555;font-size:0.85rem">coins</span>
</div>

<div class="game-area">
  <div class="card-section">
    <div class="bingo-grid" id="bingoGrid">
       </div>
  </div>

  <div class="right-panel">
    <div class="drawn-section" style="text-align: center;">
      <p style="font-size: 0.7rem; color: #666; letter-spacing: 2px;">LAST NUMBER</p>
      <div class="drawn-ball" id="ball">—</div>
    </div>
    <button class="btn btn-gold" onclick="buyCard()">🎟 Buy Card (0.50)</button>
    <button class="btn" style="background: #333; color: white;" onclick="drawNumber()">🎱 Draw Ball</button>
  </div>
</div>

<div class="dev-toggle" onclick="addCoins()">[DEV: +100 COINS]</div>

<script>
  let coins = 20;

  function updateDisplay() {
    document.getElementById('coins').innerText = coins.toFixed(2);
  }

  function buyCard() {
    if(coins >= 0.5) {
      coins -= 0.5;
      updateDisplay();
      generateCard();
    } else {
      alert("Not enough coins!");
    }
  }

  function generateCard() {
    const grid = document.getElementById('bingoGrid');
    grid.innerHTML = '';
    for(let i=0; i<25; i++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.innerText = i === 12 ? 'FREE' : Math.floor(Math.random() * 75) + 1;
      if(i === 12) cell.classList.add('free');
      cell.onclick = () => cell.classList.toggle('marked');
      grid.appendChild(cell);
    }
  }

  function drawNumber() {
    const num = Math.floor(Math.random() * 75) + 1;
    document.getElementById('ball').innerText = num;
  }

  function addCoins() {
    coins += 100;
    updateDisplay();
  }

  // Init
  generateCard();
</script>

</body>
</html>
