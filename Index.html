<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎱 Bingo Gold | Global Edition</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #FFD700;
    --gold2: #FFA500;
    --dark: #0a0a1a;
    --card-bg: #13132a;
    --marked: #FFD700;
    --free: #ff4d6d;
    --accent: #7b2fff;
    --green: #22c55e;
    --coin: #fbbf24;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--dark);
    font-family: 'Nunito', sans-serif;
    color: #fff;
    min-height: 100vh;
    overflow-x: hidden;
    background-image:
      radial-gradient(ellipse at 20% 20%, #1a0a3a 0%, transparent 50%),
      radial-gradient(ellipse at 80% 80%, #0a1a3a 0%, transparent 50%);
  }

  /* CONFETTI ANIMATION */
  .confetti-piece {
    position: fixed;
    width: 10px; height: 10px;
    top: -20px;
    animation: confetti-fall linear forwards;
    z-index: 9999;
    border-radius: 2px;
    pointer-events: none;
  }
  @keyframes confetti-fall {
    to { transform: translateY(110vh) rotate(720deg); opacity: 0; }
  }

  header { text-align: center; padding: 2rem 1rem 0.5rem; }

  .title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(3rem, 8vw, 6rem);
    background: linear-gradient(135deg, var(--gold), var(--gold2), #fff8, var(--gold));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: 4px;
    filter: drop-shadow(0 0 30px #ffd70055);
  }

  .subtitle {
    color: #aaa;
    font-size: 0.9rem;
    margin-top: -0.3rem;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .coins-bar {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 1rem;
    margin: 1rem auto;
    background: #ffffff0d;
    border: 1px solid #ffffff15;
    border-radius: 50px;
    padding: 0.6rem 2rem;
    width: fit-content;
    font-size: 1.2rem;
    font-weight: 800;
    backdrop-filter: blur(10px);
  }

  .coin-icon { font-size: 1.5rem; animation: spin 3s linear infinite; }
  @keyframes spin { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }

  .coins-amount {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2rem;
    color: var(--gold);
    letter-spacing: 2px;
  }

  .info-bar {
    display: flex;
    justify-content: center;
    gap: 1.5rem;
    margin: 0.5rem auto 1.5rem;
    flex-wrap: wrap;
  }

  .info-chip {
    background: #ffffff0a;
    border: 1px solid #ffffff20;
    border-radius: 8px;
    padding: 0.4rem 1rem;
    font-size: 0.85rem;
    color: #ccc;
  }

  .info-chip span { color: var(--gold); font-weight: 800; }

  .game-area {
    display: flex;
    flex-wrap: wrap;
    gap: 2rem;
    justify-content: center;
    padding: 0 1rem 3rem;
    align-items: flex-start;
  }

  .card-section { display: flex; flex-direction: column; align-items: center; gap: 1rem; }

  .bingo-header {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
    width: 100%;
    max-width: 340px;
  }

  .bingo-letter {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.8rem;
    text-align: center;
    padding: 0.3rem;
    border-radius: 8px;
  }

  .bingo-letter:nth-child(1) { color: #ff6b6b; }
  .bingo-letter:nth-child(2) { color: #ffd166; }
  .bingo-letter:nth-child(3) { color: #06d6a0; }
  .bingo-letter:nth-child(4) { color: #4cc9f0; }
  .bingo-letter:nth-child(5) { color: #c77dff; }

  .bingo-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
    background: #ffffff08;
    border: 1px solid #ffffff15;
    border-radius: 16px;
    padding: 12px;
    max-width: 340px;
    width: 100%;
  }

  .cell {
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 10px;
    font-weight: 800;
    font-size: 1.1rem;
    cursor: pointer;
    background: var(--card-bg);
    border: 2px solid #ffffff15;
    transition: all 0.2s ease;
    user-select: none;
    position: relative;
    overflow: hidden;
  }

  .cell.marked {
    background: linear-gradient(135deg, #7b2fff, #4361ee);
    border-color: #9d4edd;
    color: #fff;
    animation: markPop 0.3s ease;
  }

  .cell.free {
    background: linear-gradient(135deg, var(--free), #ff758c);
    border-color: #ff4d6d;
    color: white;
    font-size: 0.75rem;
    text-align: center;
    cursor: default;
  }

  .cell.winning {
    background: linear-gradient(135deg, var(--gold), var(--gold2)) !important;
    border-color: var(--gold) !important;
    color: #000 !important;
    animation: winPulse 0.8s ease infinite alternate;
  }

  @keyframes markPop {
    0% { transform: scale(0.8); }
    60% { transform: scale(1.15); }
    100% { transform: scale(1); }
  }

  @keyframes winPulse {
    from { box-shadow: 0 0 10px var(--gold); }
    to { box-shadow: 0 0 25px var(--gold), 0 0 50px #ffd70088; }
  }

  .right-panel { display: flex; flex-direction: column; gap: 1.5rem; min-width: 220px; max-width: 280px; }

  .drawn-section { text-align: center; }

  .drawn-label {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 3px;
    color: #666;
    margin-bottom: 0.5rem;
  }

  .drawn-ball {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #fff3, transparent 60%),
                linear-gradient(135deg, var(--accent), #4361ee);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 0.5rem;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2.8rem;
    border: 3px solid #ffffff30;
    box-shadow: 0 0 30px #7b2fff88;
    transition: all 0.3s ease;
  }

  .drawn-letter-name { font-size: 0.85rem; color: #888; margin-bottom: 0.3rem; }

  .btn {
    padding: 0.8rem 1.5rem;
    border: none;
    border-radius: 12px;
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 1rem;
    cursor: pointer;
    transition: all 0.2s ease;
    text-transform: uppercase;
    letter-spacing: 1px;
    width: 100%;
  }

  .btn:hover { transform: translateY(-2px); filter: brightness(1.1); }

  .btn-primary { background: linear-gradient(135deg, var(--accent), #4361ee); color: white; }
  .btn-gold { background: linear-gradient(135deg, var(--gold), var(--gold2)); color: #000; }
  .btn-danger { background: linear-gradient(135deg, #ef4444, #dc2626); color: white; }

  .called-section {
    background: #ffffff06;
    border: 1px solid #ffffff10;
    border-radius: 16px;
    padding: 1rem;
  }

  .called-title { font-size: 0.7rem; text-transform: uppercase; color: #555; text-align: center; margin-bottom: 0.5rem;}

  .called-numbers {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    max-height: 150px;
    overflow-y: auto;
  }

  .called-num { background: #ffffff10; border-radius: 6px; padding: 2px 6px; font-size: 0.75rem; color: #ccc; }

  .win-banner {
    display: none;
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0);
    background: linear-gradient(135deg, #0a0a1a, #13132a);
    border: 3px solid var(--gold);
    border-radius: 24px;
    padding: 3rem 4rem;
    text-align: center;
    z-index: 1000;
  }

  .win-banner.show { display: block; animation: bannerPop 0.5s forwards; }

  @keyframes bannerPop { to { transform: translate(-50%, -50%) scale(1); } }

  .win-title { font-family: 'Bebas Neue', sans-serif; font-size: 4rem; color: var(--gold); }

  .overlay { display: none; position: fixed; inset: 0; background: #00000088; z-index: 999; backdrop-filter: blur(4px); }
  .overlay.show { display: block; }

  .status-msg {
    text-align: center; padding: 0.8rem; border-radius: 10px; font-weight: 700; font-size: 0.9rem;
    background: #ffffff08; border: 1px solid #ffffff10; color: #888;
  }

  .auto-toggle { display: flex; align-items: center; gap: 0.5rem; justify-content: center; font-size: 0.85rem; color: #888; }

  .toggle { position: relative; width: 40px; height: 22px; background: #333; border-radius: 11px; cursor: pointer; }
  .toggle.on { background: var(--accent); }
  .toggle::after { content: ''; position: absolute; width: 16px; height: 16px; background: white; border-radius: 50%; top: 3px; left: 3px; transition: 0.3s; }
  .toggle.on::after { transform: translateX(18px); }

  /* DEV PANEL */
  .dev-toggle-btn { position: fixed; bottom: 1.5rem; right: 1.5rem; background: #1a1a2e; border: 2px solid #ffffff20; color: #888; border-radius: 50px; padding: 0.5rem 1rem; cursor: pointer; z-index: 500; }
  .dev-panel {
    position: fixed; bottom: 4.5rem; right: 1.5rem; background: #0d0d20; border: 1px solid #7b2fff55; border-radius: 16px; padding: 1.2rem; z-index: 500; min-width: 240px;
    opacity: 0; pointer-events: none; transition: 0.25s;
  }
  .dev-panel.open { opacity: 1; pointer-events: all; }
</style>
</head>
<body>

<div class="overlay" id="overlay"></div>
<div class="win-banner" id="winBanner">
  <div class="win-title">🎉 BINGO!</div>
  <p class="win-prize">You won <strong id="prizeDisplay">+5</strong> coins!</p>
  <button class="btn btn-gold" onclick="location.reload()" style="max-width:200px;margin:0 auto">Play Again</button>
</div>

<header>
  <div class="title">BINGO GOLD</div>
  <div class="subtitle">Luck • Fortune • Glory</div>
</header>

<div class="coins-bar">
  <span class="coin-icon">🪙</span>
  <span class="coins-amount" id="coinsDisplay">20</span>
  <span style="color:#555;font-size:0.85rem">coins</span>
</div>

<div class="info-bar">
  <div class="info-chip">Card: <span>0.50 coins</span></div>
  <div class="info-chip">Prize: <span>+5 coins</span></div>
  <div class="info-chip">Starting Balance: <span>20 coins</span></div>
</div>

<div class="game-area">
  <div class="card-section">
    <div class="bingo-header">
      <div class="bingo-letter">B</div>
      <div class="bingo-letter">I</div>
      <div class="bingo-letter">N</div>
      <div class="bingo-letter">G</div>
      <div class="bingo-letter">O</div>
    </div>
    <div class="bingo-grid" id="bingoGrid"></div>
    <div class="status-msg" id="statusMsg">Buy a card to start!</div>
  </div>

  <div class="right-panel">
    <div class="drawn-section">
      <div class="drawn-label">Drawn Number</div>
      <div class="drawn-ball" id="drawnBall">—</div>
      <div class="drawn-letter-name" id="drawnLetterName">Waiting...</div>
    </div>

    <button class="btn btn-gold" id="buyBtn" onclick="buyCard()">🎟 Buy Card (0.50)</button>
    <button class="btn btn-primary" id="drawBtn" onclick="drawNumber()" disabled>🎱 Draw Number</button>

    <div class="auto-toggle">
      <span>Auto-Draw</span>
      <div class="toggle" id="autoToggle" onclick="toggleAuto()"></div>
    </div>
    <div class="speed-control" style="text-align:center; color:#666; font-size: 0.8rem;">
      Speed: <input type="range" id="speedRange" min="500" max="3000" value="1500">
    </div>

    <button class="btn btn-danger" onclick="location.reload()">↺ Reset Game</button>

    <div class="called-section">
      <div class="called-title">Called Numbers (<span id="calledCount">0</span>/75)</div>
      <div class="called-numbers" id="calledNumbers"></div>
    </div>
  </div>
</div>

<button class="dev-toggle-btn" onclick="document.getElementById('devPanel').classList.toggle('open')">🛠 Dev Mode</button>
<div class="dev-panel" id="devPanel">
  <div style="color:var(--accent); font-size:0.7rem; margin-bottom:10px;">TESTING PANEL</div>
  <button style="width:100%; padding:5px; margin-bottom:5px;" onclick="coins += 100; updateDisplay();">Add 100 Coins</button>
  <button style="width:100%; padding:5px; background: green; color:white;" onclick="winGameManual()">Instant Win</button>
</div>

<script>
// LÓGICA DO JOGO (TRADUZIDA)
let coins = 20;
let cardNumbers = [];
let calledNumbers = [];
let gameActive = false;

function updateDisplay() {
    document.getElementById('coinsDisplay').innerText = coins.toFixed(2);
}

function buyCard() {
    if (coins < 0.5) return alert("Not enough coins!");
    coins -= 0.5;
    updateDisplay();
    generateCard();
    gameActive = true;
    document.getElementById('buyBtn').disabled = true;
    document.getElementById('drawBtn').disabled = false;
    document.getElementById('statusMsg').innerText = "Card Active! Good Luck!";
}

function generateCard() {
    const grid = document.getElementById('bingoGrid');
    grid.innerHTML = '';
    // Lógica simplificada de geração para demonstração
    for(let i=0; i<25; i++) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        if(i === 12) {
            cell.classList.add('free', 'marked');
            cell.innerText = 'FREE';
        } else {
            cell.innerText = Math.floor(Math.random() * 75) + 1;
        }
        grid.appendChild(cell);
    }
}

function drawNumber() {
    const num = Math.floor(Math.random() * 75) + 1;
    document.getElementById('drawnBall').innerText = num;
    document.getElementById('drawnLetterName').innerText = "Number Drawn!";
    // Adicionar logica de marcação automática aqui...
}

function winGameManual() {
    document.getElementById('overlay').classList.add('show');
    document.getElementById('winBanner').classList.add('show');
    coins += 5;
    updateDisplay();
}

function toggleAuto() {
    document.getElementById('autoToggle').classList.toggle('on');
}
</script>
</body>
</html>
