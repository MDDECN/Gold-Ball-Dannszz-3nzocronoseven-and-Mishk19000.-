<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProjectBin | Bingo Online</title>

    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">

    <style>
        :root { --gold: #FFD700; --accent: #7b2fff; --dark: #050510; --success: #00ff88; --danger: #ff4444; }
        body { background: var(--dark); font-family: 'Nunito', sans-serif; color: #fff; margin: 0; text-align: center; overflow-x: hidden; }

        #login-overlay { position: fixed; inset: 0; background: var(--dark); display: flex; justify-content: center; align-items: center; z-index: 9999; }
        .login-card { background: #13132a; padding: 30px; border-radius: 25px; border: 2px solid var(--accent); width: 85%; max-width: 350px; box-shadow: 0 0 30px rgba(123, 47, 255, 0.3); }

        .photo-selector { width: 100px; height: 100px; border-radius: 50%; border: 3px dashed var(--gold); margin: 0 auto 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; overflow: hidden; background: #1a1a3a; position: relative; }
        .photo-selector img { width: 100%; height: 100%; object-fit: cover; }
        .photo-selector span { font-size: 0.7rem; color: var(--gold); font-weight: bold; position: absolute; }

        .btn-login { width: 100%; padding: 15px; background: var(--accent); color: white; border: none; border-radius: 12px; font-weight: 900; font-size: 1.5rem; cursor: pointer; font-family: 'Bebas Neue'; transition: 0.3s; }
        .btn-login:disabled { background: #444; }

        nav { background: #13132a; padding: 15px; border-bottom: 2px solid var(--gold); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        .profile-img { width: 45px; height: 45px; border-radius: 50%; border: 2px solid var(--gold); object-fit: cover; background: #222; }

        #ranking-box { background: rgba(123, 47, 255, 0.1); margin: 20px auto; padding: 15px; border-radius: 15px; width: 90%; max-width: 350px; border: 1px solid var(--accent); }
        .rank-item { display: flex; justify-content: space-between; padding: 10px 5px; border-bottom: 1px solid #222; font-size: 0.9rem; align-items: center; }

        .bingo-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; width: 90%; max-width: 380px; margin: 20px auto; }
        .cell { aspect-ratio: 1; background: #1a1a3a; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-weight: 900; cursor: pointer; border: 1px solid #25254a; font-size: 1.2rem; }
        .cell.marked { background: var(--accent); border-color: #fff; }
        .cell.match { background: var(--success) !important; color: #000; transform: scale(1.05); box-shadow: 0 0 10px var(--success); }

        .btn-draw { background: var(--gold); border: none; padding: 15px 40px; border-radius: 50px; font-family: 'Bebas Neue'; font-size: 1.6rem; cursor: pointer; margin: 20px 0 40px; font-weight: bold; width: 80%; }
    </style>
</head>
<body>

<div id="login-overlay">
    <div class="login-card">
        <h1 style="font-family: 'Bebas Neue'; color: var(--gold); margin: 0; font-size: 3rem;">PROJECTBIN</h1>
        <p style="color: #888; margin-bottom: 20px;">ONLINE BINGO</p>
        
        <div class="photo-selector" onclick="document.getElementById('photo-input').click()">
            <span id="cam-icon">📷 PHOTO</span>
            <img id="login-preview" src="" style="display:none">
        </div>
        <input type="file" id="photo-input" accept="image/*" style="display:none" onchange="previewFile()">

        <input type="text" id="user-id" placeholder="Username" style="width:100%; padding:15px; margin-bottom:20px; border-radius:12px; border:none; background:#050510; color:white; text-align:center;">
        <button id="login-btn" class="btn-login" onclick="loginToFirestore()">PLAY NOW</button>
    </div>
</div>

<nav>
    <div style="display: flex; align-items: center; gap: 10px;">
        <img src="" id="nav-photo" class="profile-img">
        <span id="nav-name" style="font-weight: 900;">...</span>
    </div>
    <div style="color: var(--gold); font-weight: 900; font-size: 1.2rem;">🪙 <span id="coin-count">0</span></div>
</nav>

<div id="ranking-box">
    <h3 style="margin:0 0 10px; font-family: 'Bebas Neue'; color: var(--gold);">🏆 PROJECTBIN RANKING</h3>
    <div id="leaderboard">Loading...</div>
</div>

<div id="status" style="margin:10px; font-weight:bold; color:var(--gold);">CHOOSE YOUR 7 NUMBERS!</div>
<div class="bingo-grid" id="grid"></div>
<button id="draw-button" class="btn-draw" onclick="drawBall()">DRAW BALL (-10 🪙)</button>

<script>
    const firebaseConfig = {
        projectId: "projectbin-bdf03",
        appId: "1:185075588211:web:14b59b9f7f4092cf1f1e06",
        messagingSenderId: "185075588211"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let myId = "";
    let userData = null;
    let picks = [];
    let isLocked = false;
    let base64Photo = "";

    function previewFile() {
        const file = document.getElementById('photo-input').files[0];
        const reader = new FileReader();
        reader.onloadend = function() {
            base64Photo = reader.result;
            document.getElementById('login-preview').src = base64Photo;
            document.getElementById('login-preview').style.display = 'block';
            document.getElementById('cam-icon').style.display = 'none';
        }
        if (file) reader.readAsDataURL(file);
    }

    async function loginToFirestore() {
        myId = document.getElementById('user-id').value.trim().toLowerCase();
        if(!myId) return alert("Please enter a name!");

        const userRef = db.collection('users').doc(myId);
        const doc = await userRef.get();
        const today = new Date().toDateString();

        if (!doc.exists) {
            await userRef.set({
                name: myId,
                coins: 1000,
                lastLogin: today,
                myNumbers: [],
                photo: base64Photo || `https://api.dicebear.com/7.x/pixel-art/svg?seed=${myId}`
            });
        } else {
            let data = doc.data();
            const updates = { lastLogin: today };
            if (base64Photo) updates.photo = base64Photo;
            if (data.lastLogin !== today) {
                alert("Daily Bonus: +1000 coins!");
                updates.coins = 1000;
            }
            await userRef.update(updates);
        }
        startApp();
    }

    function startApp() {
        document.getElementById('login-overlay').style.display = 'none';

        db.collection('users').doc(myId).onSnapshot((doc) => {
            userData = doc.data();
            document.getElementById('nav-name').innerText = userData.name;
            document.getElementById('coin-count').innerText = userData.coins;
            document.getElementById('nav-photo').src = userData.photo;
            
            if(userData.myNumbers && userData.myNumbers.length > 0) {
                isLocked = true;
                renderCard(userData.myNumbers);
                document.getElementById('status').innerText = "CARD REGISTERED";
            } else {
                generateGrid();
            }
        });

        db.collection('users').orderBy('coins', 'desc').limit(5).onSnapshot((snap) => {
            const lb = document.getElementById('leaderboard');
            lb.innerHTML = snap.docs.map((d, i) => `
                <div class="rank-item">
                    <div style="display:flex; align-items:center; gap:8px">
                        <span>${i+1}º</span>
                        <img src="${d.data().photo}" style="width:25px; height:25px; border-radius:50%; object-fit:cover">
                        <span>${d.data().name}</span>
                    </div>
                    <span style="color:var(--gold)">🪙 ${d.data().coins}</span>
                </div>
            `).join('');
        });
    }

    function generateGrid() {
        const grid = document.getElementById('grid');
        grid.innerHTML = '';
        for(let i=1; i<=25; i++) {
            const cell = document.createElement('div');
            cell.className = 'cell';
            cell.innerText = i;
            cell.onclick = () => {
                if(isLocked) return;
                if(cell.classList.contains('marked')) {
                    cell.classList.remove('marked');
                    picks = picks.filter(x => x !== i);
                } else if(picks.length < 7) {
                    cell.classList.add('marked');
                    picks.push(i);
                }
                if(picks.length === 7) confirmCard();
            };
            grid.appendChild(cell);
        }
    }

    function confirmCard() {
        if(confirm("Confirm these numbers? You cannot change them later.")) {
            db.collection('users').doc(myId).update({ myNumbers: picks });
        }
    }

    function renderCard(nums) {
        const grid = document.getElementById('grid');
        grid.innerHTML = '';
        nums.forEach(n => {
            const cell = document.createElement('div');
            cell.className = 'cell marked';
            cell.id = 'num-' + n;
            cell.innerText = n;
            grid.appendChild(cell);
        });
    }

    async function drawBall() {
        if(!isLocked) return alert("Select your numbers first!");
        if(userData.coins < 10) return alert("Out of coins! Come back tomorrow.");

        const ball = Math.floor(Math.random() * 75) + 1;
        const isMatch = userData.myNumbers.includes(ball);
        const prize = isMatch ? 200 : 0;

        await db.collection('users').doc(myId).update({
            coins: userData.coins - 10 + prize
        });

        const st = document.getElementById('status');
        st.innerText = `DRAWN: ${ball}`;
        st.style.color = isMatch ? "var(--success)" : "var(--danger)";
        
        if(isMatch) {
            const el = document.getElementById('num-' + ball);
            if(el) el.classList.add('match');
        }
    }
</script>
</body>
</html>
