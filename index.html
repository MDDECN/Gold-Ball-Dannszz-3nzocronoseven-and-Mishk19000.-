<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ball 8 | Bingo Gold</title>
  
  <meta name="google-site-verification" content="OIvgzp_QKd0d3xJcsX3grlRAuBjDDVz2oQJOUyKPocc" />

  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold: #FFD700;
      --gold2: #FFA500;
      --dark: #0a0a1a;
      --card-bg: #13132a;
      --marked: #7b2fff;
      --free: #ff4d6d;
    }

    body {
      background: var(--dark);
      font-family: 'Nunito', sans-serif;
      color: #fff;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      background-image: radial-gradient(circle at center, #1a0a3a 0%, #0a0a1a 100%);
      padding-bottom: 50px;
    }

    header { padding: 30px 20px; text-align: center; }

    .title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(3rem, 10vw, 5rem);
      background: linear-gradient(135deg, var(--gold), #fff, var(--gold2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: 0;
    }

    .subtitle { color: #aaa; letter-spacing: 5px; font-weight: 600; font-size: 0.9rem; }

    /* Área de Sorteio */
    .draw-panel {
      background: rgba(255, 255, 255, 0.1);
      padding: 20px;
      border-radius: 20px;
      margin-bottom: 20px;
      text-align: center;
      width: 380px;
      max-width: 90vw;
      border: 1px solid var(--gold);
    }

    .current-ball {
      width: 80px;
      height: 80px;
      background: radial-gradient(circle at 30% 30%, #fff, var(--gold));
      color: #000;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      font-weight: 800;
      margin: 10px auto;
      box-shadow: 0 0 20px var(--gold2);
    }

    /* Grade do Bingo */
    .bingo-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      background: rgba(255, 255, 255, 0.05);
      padding: 20px;
      border-radius: 20px;
      border: 1px solid rgba(255, 215, 0, 0.2);
      width: 380px;
      max-width: 90vw;
    }

    .cell {
      aspect-ratio: 1;
      background: var(--card-bg);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 1.2rem;
      cursor: pointer;
      border: 2px solid #222;
      transition: 0.2s;
    }

    .cell.marked { background: var(--marked); border-color: #fff; transform: scale(0.95); }
    .cell.free { background: var(--free); font-size: 0.8rem; }

    .controls { margin-top: 25px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }

    .btn {
      padding: 12px 25px;
      border-radius: 12px;
      border: none;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.2rem;
      cursor: pointer;
      transition: 0.3s;
    }

    .btn-draw { background: var(--gold); color: #000; font-size: 1.5rem; }
    .btn-new { background: #333; color: #fff; }
    .btn:hover { transform: translateY(-3px); opacity: 0.9; }

    #history { margin-top: 10px; font-size: 0.8rem; color: #ffda44; font-weight: bold; }
  </style>
</head>
<body>

<header>
  <h1 class="title">BINGO GOLD</h1>
  <p class="subtitle">BY MDDECN</p>
</header>

<div class="draw-panel">
  <div style="font-size: 0.8rem; letter-spacing: 2px;">ÚLTIMA BOLA:</div>
  <div class="current-ball" id="ballDisplay">?</div>
  <div id="history">Sorteados: Nenhum</div>
  <div class="controls">
    <button class="btn btn-draw" onclick="drawBall()">SORTEAR BOLA 🎱</button>
  </div>
</div>

<div class="bingo-grid" id="bingoGrid"></div>

<div class="controls">
  <button class="btn btn-new" onclick="generateCard()">GERAR NOVA CARTELA 🎟️</button>
</div>

<script>
  let drawnBalls = [];
  let allNumbers = Array.from({length: 75}, (_, i) => i + 1);

  function drawBall() {
    if (drawnBalls.length >= 75) {
      alert("Todos os números já foram sorteados!");
      return;
    }

    let available = allNumbers.filter(n => !drawnBalls.includes(n));
    let picked = available[Math.floor(Math.random() * available.length)];
    
    drawnBalls.push(picked);
    document.getElementById('ballDisplay').innerText = picked;
    document.getElementById('history').innerText = "Sorteados: " + drawnBalls.join(', ');
  }

  function generateCard() {
    const grid = document.getElementById('bingoGrid');
    grid.innerHTML = '';
    
    // Números para a cartela (5 por coluna, mas aqui faremos aleatório 25 de 75)
    let cardNumbers = [...allNumbers].sort(() => Math.random() - 0.5).slice(0, 25);

    for(let i = 0; i < 25; i++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      if(i === 12) {
        cell.innerText = 'FREE';
        cell.classList.add('free', 'marked');
      } else {
        cell.innerText = cardNumbers[i];
        cell.onclick = () => cell.classList.toggle('marked');
      }
      grid.appendChild(cell);
    }
    // Reset do sorteio ao trocar cartela (opcional)
    drawnBalls = [];
    document.getElementById('ballDisplay').innerText = "?";
    document.getElementById('history').innerText = "Sorteados: Nenhum";
  }

  // Inicia a primeira cartela
  generateCard();
</script>

</body>
</html>
