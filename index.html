<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProjectBin | Premium Online Bingo</title>

    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">

    <style>
        :root { 
            --gold: #FFD700; 
            --accent: #7b2fff; 
            --dark: #0a0a1a; 
            --card-bg: #13132a;
            --success: #00ff88; 
            --danger: #ff4444; 
        }

        body { 
            background: var(--dark); 
            font-family: 'Nunito', sans-serif; 
            color: #fff; 
            margin: 0; 
            text-align: center; 
            overflow-x: hidden; 
        }

        #login-overlay { 
            position: fixed; inset: 0; 
            background: rgba(5, 5, 16, 0.95); 
            display: flex; justify-content: center; align-items: center; 
            z-index: 9999; backdrop-filter: blur(10px);
        }

        .login-card { 
            background: var(--card-bg); 
            padding: 40px 30px; 
            border-radius: 30px; 
            border: 1px solid rgba(255, 215, 0, 0.3); 
            width: 85%; max-width: 380px; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .photo-selector { 
            width: 110px; height: 110px; 
            border-radius: 50%; 
            border: 3px dashed var(--accent); 
            margin: 0 auto 25px; 
            cursor: pointer; 
            display: flex; align-items: center; justify-content: center; 
            overflow: hidden; background: #1a1a3a; 
            transition: 0.3s;
        }

        .photo-selector:hover { border-color: var(--gold); transform: scale(1.05); }
        .photo-selector img { width: 100%; height: 100%; object-fit: cover; }

        .bingo-grid { 
            display: grid; 
            grid-template-columns: repeat(5, 1fr); 
            gap: 10px; 
            width: 92%; max-width: 400px; 
            margin: 20px auto; 
        }

        .cell { 
            aspect-ratio: 1; 
            background: #1a1a3a; 
            border-radius: 12px; 
            display: flex; align-items: center; justify-content: center; 
            font-weight: 900; cursor: pointer; 
            border: 2px solid transparent; 
            font-size: 1.3rem; transition: 0.2s;
        }

        .cell:hover:not(.locked) { border-color: var(--accent); background: #25254a; }
        .cell.marked { background: var(--accent); color: white; border-color: #fff; }
        .cell.match { 
            background: var(--success) !important; 
            color: #000; 
            animation: pulse 0.5s infinite alternate;
        }

        @keyframes pulse {
            from { transform: scale(1); box-shadow: 0 0 5px var(--success); }
            to { transform: scale(1.1); box-shadow: 0 0 15px var(--success); }
        }

        .btn-draw { 
            background: linear-gradient(45deg, var(--gold), #ffaa00); 
            border: none; 
            padding: 18px 0; 
            border-radius: 15px; 
            font-family: 'Bebas Neue'; 
            font-size: 1.8rem; 
            cursor: pointer; 
            margin: 20px 0; 
            width: 90%; max-width: 400px;
            box-shadow: 0 5px 15px rgba(255, 215, 0, 0.2);
            transition: 0.3s;
        }

        .btn-draw:active { transform: scale(0.95); }
        .btn-draw:disabled { filter: grayscale(1); cursor: not-allowed; }

        nav { 
            background: var(--card-bg); 
            padding: 15px 20px; 
            display: flex; justify-content: space-between; 
            align-items: center; 
            border-bottom: 1px solid rgba(255,215,0,0.2);
        }

        #ball-display {
            font-size: 4rem;
            font-family: 'Bebas Neue';
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--gold);
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
        }

        .rank-item {
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 8px 0; 
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
    </style>
</head>
<body>

<div id="login-overlay">
    <div class="login-card">
        <h1 style="font-family: 'Bebas Neue'; color: var(--gold); margin: 0; font-size: 3.5rem; letter-spacing: 2px;">PROJECTBIN</h1>
        <p style="color: #aaa; margin-bottom: 25px; letter-spacing: 3px;">ONLINE BINGO</p>
        
        <div class="photo-selector" onclick="document.getElementById('photo-input').click()">
            <span id="cam-icon" style="font-size: 0.8rem; font-weight: bold;">ADD PHOTO</span>
            <img id="login-preview" src="" style="display:none">
        </div>
        <input type="file" id="photo-input" accept="image/*" style="display:none" onchange="processPhoto()">

        <input type="text" id="user-id" placeholder="Username" style="width:100%; padding:15px; margin-bottom:20px; border-radius:12px; border:1px solid #333; background:#050510; color:white; text-align:center; box-sizing: border-box;">
        <button id="login-btn" onclick="loginToFirestore()" style="width: 100%; height: 60px; border-radius: 12px; background: var(--accent); color: white; border: none; font-family: 'Bebas Neue'; font-size: 1.8rem; cursor: pointer;">PLAY NOW</button>
    </div>
</div>

<nav>
    <div style="display: flex; align-items: center; gap: 12px;">
        <img src="" id="nav-photo" style="width:45px; height:45px; border-radius:50%; border:2px solid var(--gold); object-fit:cover;">
        <span id="nav-name" style="font-weight: 900; letter-spacing: 1px;">---</span>
    </div>
    <div style="background: rgba(255,215,0,0.1); padding: 5px 15px; border-radius: 20px; color: var(--gold); font-weight: 900;">
        🪙 <span id="coin-count">0</span>
    </div>
</nav>

<div id="ranking-box" style="margin: 20px auto; width: 90%; max-width: 400px; background: rgba(123, 47, 255, 0.05); border-radius: 20px; padding: 15px; border: 1px solid rgba(123, 47, 255, 0.2);">
    <h3 style="margin:0 0 15px; font-family: 'Bebas Neue'; color: var(--gold); font-size: 1.5rem;">🏆 TOP PLAYERS</h3>
    <div id="leaderboard">Loading...</div>
</div>

<div id="ball-display">--</div>
<div id="status" style="margin-bottom:10px; font-weight:bold; color:#888;">PICK 7 NUMBERS</div>

<div class="bingo-grid" id="grid"></div>

<button id="draw-btn" class="btn-draw" onclick="drawBall()">DRAW BALL (-10 🪙)</button>

<script>
    const firebaseConfig = {
        projectId: "projectbin-bdf03",
        appId: "1:185075588211:web:14b59b9f7f4092cf1f1e06",
        messagingSenderId: "185075588211"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let myId = "";
    let userData = null;
    let picks = [];
    let base64Photo = "";

    function processPhoto() {
        const file = document.getElementById('photo-input').files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (e) => {
            const img = new Image();
            img.onload = () => {
                const canvas = document.createElement('canvas');
                const MAX_WIDTH = 150;
                const scaleSize = MAX_WIDTH / img.width;
                canvas.width = MAX_WIDTH;
                canvas.height = img.height * scaleSize;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                base64Photo = canvas.toDataURL('image/jpeg', 0.7);
                document.getElementById('login-preview').src = base64Photo;
                document.getElementById('login-preview').style.display = 'block';
                document.getElementById('cam-icon').style.display = 'none';
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    }

    async function loginToFirestore() {
        const input = document.getElementById('user-id');
        myId = input.value.trim().toLowerCase();
        if(!myId) return alert("Please enter a username!");

        const userRef = db.collection('users').doc(myId);
        const doc = await userRef.get();
        const today = new Date().toDateString();

        if (!doc.exists) {
            await userRef.set({
                name: myId,
                coins: 1000,
                lastLogin: today,
                myNumbers: [],
                hits: [],
                photo: base64Photo || `https://api.dicebear.com/7.x/avataaars/svg?seed=${myId}`
            });
        } else {
            const data = doc.data();
            const updates = {};
            if (base64Photo) updates.photo = base64Photo;
            if (data.lastLogin !== today) {
                alert("Daily Bonus: +500 coins!");
                updates.coins = (data.coins || 0) + 500;
                updates.lastLogin = today;
            }
            if(Object.keys(updates).length > 0) await userRef.update(updates);
        }
        startApp();
    }

    function startApp() {
        document.getElementById('login-overlay').style.display = 'none';

        db.collection('users').doc(myId).onSnapshot((doc) => {
            userData = doc.data();
            document.getElementById('nav-name').innerText = userData.name.toUpperCase();
            document.getElementById('coin-count').innerText = userData.coins;
            document.getElementById('nav-photo').src = userData.photo;
            
            if(userData.myNumbers?.length > 0) {
                renderCard(userData.myNumbers, userData.hits || []);
                document.getElementById('status').innerText = "ACTIVE CARD";
            } else {
                generateGrid();
            }
        });

        db.collection('users').orderBy('coins', 'desc').limit(5).onSnapshot((snap) => {
            const lb = document.getElementById('leaderboard');
            lb.innerHTML = snap.docs.map((d, i) => `
                <div class="rank-item">
                    <div style="display:flex; align-items:center; gap:10px">
                        <span style="color:var(--gold); font-weight:bold; width:20px">${i+1}st</span>
                        <img src="${d.data().photo}" style="width:30px; height:30px; border-radius:50%; object-fit:cover; border: 1px solid var(--accent)">
                        <span style="font-size:0.9rem">${d.data().name}</span>
                    </div>
                    <span style="color:var(--gold); font-weight:bold">🪙 ${d.data().coins}</span>
                </div>
            `).join('');
        });
    }

    function generateGrid() {
        const grid = document.getElementById('grid');
        grid.innerHTML = '';
        for(let i=1; i<=25; i++) {
            const cell = document.createElement('div');
            cell.className = 'cell';
            cell.innerText = i;
            cell.onclick = () => {
                if(cell.classList.contains('marked')) {
                    cell.classList.remove('marked');
                    picks = picks.filter(x => x !== i);
                } else if(picks.length < 7) {
                    cell.classList.add('marked');
                    picks.push(i);
                }
                if(picks.length === 7) setTimeout(confirmCard, 300);
            };
            grid.appendChild(cell);
        }
    }

    function confirmCard() {
        if(confirm(`Confirm numbers: ${picks.join(', ')}?`)) {
            db.collection('users').doc(myId).update({ myNumbers: picks, hits: [] });
        }
    }

    function renderCard(nums, hits) {
        const grid = document.getElementById('grid');
        grid.innerHTML = '';
        nums.sort((a,b) => a-b).forEach(n => {
            const cell = document.createElement('div');
            cell.className = 'cell marked locked';
            if(hits.includes(n)) cell.classList.add('match');
            cell.id = 'num-' + n;
            cell.innerText = n;
            grid.appendChild(cell);
        });
    }

    async function drawBall() {
        if(!userData.myNumbers?.length) return alert("Select your numbers first!");
        if(userData.coins < 10) return alert("Insufficient balance!");

        const btn = document.getElementById('draw-btn');
        const ballEl = document.getElementById('ball-display');
        btn.disabled = true;

        let counter = 0;
        const interval = setInterval(() => {
            ballEl.innerText = Math.floor(Math.random() * 75) + 1;
            counter++;
            if(counter > 15) {
                clearInterval(interval);
                finalizeDraw();
            }
        }, 50);

        async function finalizeDraw() {
            const ball = Math.floor(Math.random() * 75) + 1;
            ballEl.innerText = ball;
            
            const isMatch = userData.myNumbers.includes(ball);
            const prize = isMatch ? 250 : 0;
            const newHits = [...(userData.hits || [])];
            
            if(isMatch && !newHits.includes(ball)) newHits.push(ball);

            await db.collection('users').doc(myId).update({
                coins: userData.coins - 10 + prize,
                hits: newHits
            });

            if(isMatch) {
                ballEl.style.color = "var(--success)";
                alert("MATCH! +250 coins!");
            } else {
                ballEl.style.color = "var(--gold)";
            }
            
            btn.disabled = false;
        }
    }
</script>
</body>
</html>
