<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ball 8 | Bingo Gold</title>
  
  <meta name="google-site-verification" content="OIvgzp_QKd0d3xJcsX3grlRAuBjDDVz2oQJOUyKPocc" />

  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold: #FFD700;
      --gold2: #FFA500;
      --dark: #0a0a1a;
      --card-bg: #13132a;
      --marked: #7b2fff;
      --free: #ff4d6d;
    }

    body {
      background: var(--dark);
      font-family: 'Nunito', sans-serif;
      color: #fff;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      background-image: radial-gradient(circle at center, #1a0a3a 0%, #0a0a1a 100%);
    }

    header { padding: 40px 20px; text-align: center; }

    .title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(3rem, 10vw, 5rem);
      background: linear-gradient(135deg, var(--gold), #fff, var(--gold2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.3));
      margin: 0;
    }

    .subtitle {
      color: #aaa;
      letter-spacing: 5px;
      font-weight: 600;
      margin-top: 10px;
      font-size: 0.9rem;
    }

    .bingo-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      background: rgba(255, 255, 255, 0.05);
      padding: 20px;
      border-radius: 20px;
      border: 1px solid rgba(255, 215, 0, 0.2);
      max-width: 90vw;
      width: 380px;
    }

    .cell {
      aspect-ratio: 1;
      background: var(--card-bg);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 1.2rem;
      cursor: pointer;
      border: 2px solid #222;
      transition: 0.2s;
    }

    .cell:hover { border-color: var(--gold); }
    .cell.marked { background: var(--marked); border-color: #fff; transform: scale(0.95); }
    .cell.free { background: var(--free); font-size: 0.8rem; }

    .controls { margin-top: 30px; }

    .btn {
      padding: 15px 30px;
      border-radius: 12px;
      border: none;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.5rem;
      letter-spacing: 1px;
      cursor: pointer;
      transition: 0.3s;
      background: linear-gradient(135deg, var(--gold), var(--gold2));
      color: #000;
    }

    .btn:hover { transform: translateY(-3px); box-shadow: 0 5px 15px rgba(255, 215, 0, 0.4); }
  </style>
</head>
<body>

<header>
  <h1 class="title">BINGO GOLD</h1>
  <p class="subtitle">BY MDDECN</p>
</header>

<div class="bingo-grid" id="bingoGrid"></div>

<div class="controls">
  <button class="btn" onclick="generateCard()">NEW CARD</button>
</div>

<script>
  function generateCard() {
    const grid = document.getElementById('bingoGrid');
    grid.innerHTML = '';
    // Gerar números aleatórios de 1 a 75
    let numbers = Array.from({length: 75}, (_, i) => i + 1).sort(() => Math.random() - 0.5);

    for(let i = 0; i < 25; i++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      if(i === 12) {
        cell.innerText = 'FREE';
        cell.classList.add('free', 'marked');
      } else {
        cell.innerText = numbers[i];
        cell.onclick = () => cell.classList.toggle('marked');
      }
      grid.appendChild(cell);
    }
  }
  // Iniciar jogo automaticamente ao carregar
  generateCard();
</script>

</body>
</html>
