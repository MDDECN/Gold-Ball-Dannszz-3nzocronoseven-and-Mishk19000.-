<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bingo Gold Online | REAL CLOUD</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --gold: #FFD700;
            --gold2: #FFA500;
            --dark: #050510;
            --card-bg: #13132a;
            --accent: #7b2fff;
            --success: #00ff88;
        }

        body {
            background: var(--dark);
            font-family: 'Nunito', sans-serif;
            color: #fff;
            margin: 0;
            overflow-x: hidden;
            text-align: center;
        }

        /* --- NAVIGATION --- */
        nav {
            background: rgba(20, 20, 50, 0.95);
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--gold);
            position: sticky;
            top: 0; z-index: 1000;
        }

        .user-stats { display: flex; align-items: center; gap: 15px; }
        .profile-pic { width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--gold); object-fit: cover; }
        
        .level-badge {
            background: var(--gold); color: #000;
            padding: 2px 8px; border-radius: 5px; font-weight: 900; font-size: 0.8rem;
        }

        /* --- XP BAR --- */
        .xp-container { width: 100%; height: 5px; background: #222; position: absolute; bottom: 0; left: 0; }
        #xp-bar { height: 100%; width: 0%; background: var(--success); transition: 0.5s; }

        /* --- LOGIN --- */
        #login-overlay {
            position: fixed; inset: 0; background: var(--dark);
            display: flex; justify-content: center; align-items: center; z-index: 9999;
        }
        .login-card {
            background: #13132a; padding: 40px; border-radius: 25px;
            text-align: center; border: 2px solid var(--accent); width: 320px;
        }

        /* --- GAME GRID --- */
        .bingo-grid {
            display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px;
            background: rgba(255,255,255,0.05); padding: 15px; border-radius: 20px; width: 350px; margin: 0 auto;
        }
        .cell {
            aspect-ratio: 1; background: var(--card-bg); border: 2px solid #222;
            border-radius: 10px; display: flex; align-items: center; justify-content: center;
            font-weight: 900; cursor: pointer;
        }
        .cell.marked { background: var(--accent); border-color: white; }
        .cell.match { background: var(--success) !important; color: #000; box-shadow: 0 0 15px var(--success); }

        .btn-draw {
            background: var(--gold); color: black; padding: 15px 40px; border-radius: 15px;
            border: none; font-family: 'Bebas Neue'; font-size: 1.8rem; cursor: pointer; margin-top: 20px;
        }
    </style>
</head>
<body>

<div id="login-overlay">
    <div class="login-card">
        <h2 style="font-family: 'Bebas Neue'; color: var(--gold);">BINGO GOLD ONLINE</h2>
        <input type="text" id="user-id" style="width:100%; padding:10px; margin:10px 0; border-radius:8px;" placeholder="Username">
        <button onclick="loginToCloud()" style="width:100%; padding:12px; background:var(--accent); color:white; border:none; border-radius:8px; font-weight:bold; cursor:pointer;">CONNECT TO CLOUD</button>
    </div>
</div>

<nav>
    <div class="user-stats">
        <img src="" id="nav-avatar" class="profile-pic">
        <div style="text-align: left;">
            <div style="font-weight: bold;"><span id="nav-username">Player</span> <span class="level-badge">LVL <span id="lvl-display">1</span></span></div>
            <div style="color: var(--gold); font-size: 0.8rem;">🪙 <span id="coin-count">0</span></div>
        </div>
    </div>
    <div style="color: var(--success); font-size: 0.7rem; font-weight: bold;">● <span id="online-users">0</span> ONLINE</div>
    <div class="xp-container"><div id="xp-bar"></div></div>
</nav>

<div class="main-content" style="padding: 20px;">
    <div id="status-msg" style="margin-bottom: 10px; font-weight: 900; color: var(--gold);">PICK 7 NUMBERS!</div>
    <div class="draw-circle" id="drawn-ball" style="font-size: 3rem; background: white; color: black; width: 80px; height: 80px; border-radius: 50%; margin: 10px auto; display: flex; align-items: center; justify-content: center;">?</div>
    <div class="bingo-grid" id="grid"></div>
    <button class="btn-draw" onclick="drawNumber()">DRAW (10 COINS)</button>
</div>

<script>
    // --- 1. FIREBASE CONFIG (COLE SUAS CHAVES AQUI) ---
    const firebaseConfig = {
        apiKey: "SUA_API_KEY",
        authDomain: "SEU_PROJETO.firebaseapp.com",
        databaseURL: "https://SEU_PROJETO.firebaseio.com",
        projectId: "SEU_PROJETO",
        storageBucket: "SEU_PROJETO.appspot.com",
        messagingSenderId: "00000000",
        appId: "1:000000:web:000000"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    let myId = "";
    let selectedNumbers = [];
    let userData = {};

    // --- 2. LOGIN & CLOUD SYNC ---
    function loginToCloud() {
        myId = document.getElementById('user-id').value;
        if(!myId) return alert("Please enter a username!");

        database.ref('users/' + myId).once('value', (snapshot) => {
            if (!snapshot.exists()) {
                database.ref('users/' + myId).set({
                    name: myId, coins: 1000, lvl: 1, xp: 0
                });
            }
            notifyLogin(myId);
            startSync();
        });
    }

    function startSync() {
        document.getElementById('login-overlay').style.display = 'none';
        database.ref('users/' + myId).on('value', (snapshot) => {
            userData = snapshot.val();
            updateUI();
        });
        database.ref('users').on('value', (s) => document.getElementById('online-users').innerText = s.numChildren());
        generateCard();
    }

    // --- 3. NOTIFICATIONS ---
    function notifyLogin(name) {
        database.ref('notifications').push({ msg: `${name} joined!`, time: Date.now() });
    }

    database.ref('notifications').limitToLast(1).on('child_added', (s) => {
        const d = s.val();
        if(Date.now() - d.time < 5000) showToast(d.msg);
    });

    function showToast(txt) {
        const t = document.createElement('div');
        t.innerText = txt;
        t.style = "position:fixed; top:70px; right:20px; background:var(--accent); padding:10px; border-radius:10px; z-index:2000; animation: fade 3s;";
        document.body.appendChild(t);
        setTimeout(() => t.remove(), 3000);
    }

    // --- 4. GAME ENGINE ---
    function drawNumber() {
        if(selectedNumbers.length < 1) return alert("Select numbers first!");
        if(userData.coins < 10) return alert("No coins!");

        const drawn = Math.floor(Math.random() * 75) + 1;
        document.getElementById('drawn-ball').innerText = drawn;

        let upd = { coins: userData.coins - 10, xp: userData.xp };
        if(selectedNumbers.includes(drawn)) {
            upd.coins += 50; upd.xp += 20;
            if(upd.xp >= userData.lvl * 100) { upd.xp = 0; upd.lvl = userData.lvl + 1; alert("Level Up!"); }
            highlight(drawn);
        }
        database.ref('users/' + myId).update(upd);
    }

    function generateCard() {
        const grid = document.getElementById('grid');
        grid.innerHTML = '';
        let nums = Array.from({length: 75}, (_, i) => i + 1).sort(() => Math.random() - 0.5);
        for(let i=0; i<25; i++) {
            const cell = document.createElement('div');
            cell.className = 'cell'; cell.innerText = nums[i];
            cell.onclick = () => {
                if(cell.classList.contains('marked')) {
                    cell.classList.remove('marked');
                    selectedNumbers = selectedNumbers.filter(n => n !== nums[i]);
                } else if(selectedNumbers.length < 7) {
                    cell.classList.add('marked');
                    selectedNumbers.push(nums[i]);
                }
                document.getElementById('status-msg').innerText = `SELECTED: ${selectedNumbers.length}/7`;
            };
            grid.appendChild(cell);
        }
    }

    function highlight(n) {
        document.querySelectorAll('.cell').forEach(c => { if(parseInt(c.innerText) === n) c.classList.add('match'); });
    }

    function updateUI() {
        document.getElementById('nav-username').innerText = userData.name;
        document.getElementById('coin-count').innerText = userData.coins;
        document.getElementById('lvl-display').innerText = userData.lvl;
        document.getElementById('nav-avatar').src = `https://api.dicebear.com/7.x/pixel-art/svg?seed=${userData.name}`;
        document.getElementById('xp-bar').style.width = (userData.xp / (userData.lvl * 100)) * 100 + "%";
    }
</script>

</body>
</html>
