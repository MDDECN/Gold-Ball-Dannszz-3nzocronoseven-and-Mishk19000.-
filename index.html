<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ball 8 | Bingo Gold</title>
  
  <meta name="google-site-verification" content="p9Vx3kD5G4OAxKjKJjFUuTaVU77bti1rnM1KORJsVlU" />

  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    /* Estilos do Bingo Gold */
    :root {
      --gold: #FFD700; --gold2: #FFA500; --dark: #0a0a1a;
      --card-bg: #13132a; --marked: #7b2fff; --free: #ff4d6d;
    }
    body {
      background: var(--dark); font-family: 'Nunito', sans-serif; color: #fff;
      text-align: center; min-height: 100vh; margin: 0;
    }
    .title {
      font-family: 'Bebas Neue', sans-serif; font-size: 4rem;
      background: linear-gradient(135deg, var(--gold), var(--gold2));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .bingo-grid {
      display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px;
      max-width: 350px; margin: 20px auto; background: rgba(255,255,255,0.05);
      padding: 15px; border-radius: 15px;
    }
    .cell {
      aspect-ratio: 1; background: var(--card-bg); border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; cursor: pointer; border: 1px solid #333;
    }
    .cell.marked { background: var(--marked); border-color: #fff; }
    .cell.free { background: var(--free); }
    .btn {
      padding: 15px 30px; border-radius: 10px; border: none;
      font-weight: 800; cursor: pointer; background: var(--gold); color: #000;
    }
  </style>
</head>
<body>

<header style="padding: 20px;">
  <div class="title">BINGO GOLD</div>
  <p style="color: #888;">Luck • Fortune • Glory</p>
</header>

<div id="game">
  <div class="bingo-grid" id="grid"></div>
  <button class="btn" onclick="generateCard()">NEW CARD</button>
</div>

<script>
  function generateCard() {
    const grid = document.getElementById('grid');
    grid.innerHTML = '';
    for(let i=0; i<25; i++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      if(i === 12) {
        cell.innerText = 'FREE';
        cell.classList.add('free', 'marked');
      } else {
        cell.innerText = Math.floor(Math.random() * 75) + 1;
        cell.onclick = () => cell.classList.toggle('marked');
      }
      grid.appendChild(cell);
    }
  }
  generateCard();
</script>

</body>
</html>
