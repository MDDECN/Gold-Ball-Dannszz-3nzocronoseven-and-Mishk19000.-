<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bingo Gold Online | Mishk Pro</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --gold: #FFD700;
            --accent: #7b2fff;
            --dark: #050510;
            --success: #00ff88;
        }

        body {
            background: var(--dark);
            font-family: 'Nunito', sans-serif;
            color: #fff;
            margin: 0;
            text-align: center;
        }

        /* --- LOGIN SCREEN --- */
        #login-overlay {
            position: fixed; inset: 0; background: var(--dark);
            display: flex; justify-content: center; align-items: center; z-index: 9999;
        }
        .login-card {
            background: #13132a; padding: 30px; border-radius: 25px;
            border: 2px solid var(--accent); width: 90%; max-width: 350px;
            box-shadow: 0 0 30px rgba(123, 47, 255, 0.3);
        }
        
        .login-card input[type="text"] {
            width: 100%; padding: 12px; margin: 15px 0; border-radius: 10px;
            border: none; background: #050510; color: white; box-sizing: border-box;
        }

        /* STYLISH REGISTER BUTTON */
        .btn-register {
            width: 100%; padding: 15px; background: var(--accent);
            color: white; border: none; border-radius: 12px;
            font-weight: 900; font-size: 1.1rem; cursor: pointer;
            transition: transform 0.2s, background 0.2s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }
        .btn-register:active { transform: scale(0.95); background: #5a1ec9; }

        .photo-preview {
            width: 80px; height: 80px; border-radius: 50%;
            border: 2px dashed var(--gold); margin: 10px auto;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden; background: #222;
            cursor: pointer;
        }
        #preview-img { width: 100%; height: 100%; object-fit: cover; display: none; }

        /* --- GAME UI --- */
        nav { background: #13132a; padding: 10px; border-bottom: 2px solid var(--gold); display: flex; justify-content: space-between; align-items: center; }
        .profile-img { width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--gold); object-fit: cover; }
        .bingo-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; width: 95%; max-width: 350px; margin: 20px auto; }
        .cell { aspect-ratio: 1; background: #1a1a3a; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: bold; cursor: pointer; }
        .cell.marked { background: var(--accent); color: white; }
        .cell.match { background: var(--success); color: #000; box-shadow: 0 0 10px var(--success); }
    </style>
</head>
<body>

<div id="login-overlay">
    <div class="login-card">
        <h2 style="font-family: 'Bebas Neue'; color: var(--gold); font-size: 2rem; margin: 0;">BINGO GOLD</h2>
        <p style="font-size: 0.8rem; color: #888;">Create your online account</p>
        
        <div class="photo-preview" onclick="document.getElementById('input-photo').click()">
            <span id="photo-placeholder" style="font-size: 0.7rem;">📷 PHOTO</span>
            <img id="preview-img" src="">
        </div>
        <input type="file" id="input-photo" accept="image/*" capture="user" style="display: none;" onchange="handlePhoto(this)">
        
        <input type="text" id="user-id" placeholder="Username...">
        
        <button class="btn-register" onclick="loginToCloud()">CONNECT TO CLOUD</button>
    </div>
</div>

<nav>
    <div style="display: flex; align-items: center; gap: 10px;">
        <img src="" id="nav-photo" class="profile-img">
        <span id="nav-name" style="font-weight: bold;">...</span>
    </div>
    <div style="color: var(--gold); font-weight: 900;">🪙 <span id="coin-count">0</span></div>
</nav>

<div id="status" style="padding: 15px; color: var(--success); font-weight: bold;">PICK YOUR NUMBERS!</div>
<div class="bingo-grid" id="grid"></div>
<button onclick="drawNumber()" style="background: var(--gold); border: none; padding: 15px 30px; border-radius: 10px; font-weight: 900; margin-bottom: 20px; cursor: pointer; font-family: 'Nunito';">DRAW BALL (10 coins)</button>

<script>
    // --- FIREBASE CONFIGURATION ---
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_PROJECT.firebaseapp.com",
        databaseURL: "https://YOUR_PROJECT.firebaseio.com",
        projectId: "YOUR_PROJECT",
        storageBucket: "YOUR_PROJECT.appspot.com",
        messagingSenderId: "YOUR_ID",
        appId: "YOUR_APP_ID"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    let myId = "";
    let myPhotoBase64 = "";
    let selectedNums = [];

    // --- PHOTO HANDLING ---
    function handlePhoto(input) {
        const file = input.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                myPhotoBase64 = e.target.result;
                document.getElementById('preview-img').src = myPhotoBase64;
                document.getElementById('preview-img').style.display = 'block';
                document.getElementById('photo-placeholder').style.display = 'none';
            };
            reader.readAsDataURL(file);
        }
    }

    // --- LOGIN LOGIC ---
    function loginToCloud() {
        myId = document.getElementById('user-id').value.trim();
        if(!myId) return alert("Please enter a username!");

        const userRef = database.ref('users/' + myId);
        
        userRef.once('value', (snapshot) => {
            if (!snapshot.exists()) {
                // If user doesn't exist, create a new one
                userRef.set({
                    name: myId,
                    coins: 1000,
                    photo: myPhotoBase64 || "https://api.dicebear.com/7.x/pixel-art/svg?seed=" + myId,
                    lvl: 1
                });
            }
            startOnlineGame();
        });
    }

    function startOnlineGame() {
        document.getElementById('login-overlay').style.display = 'none';
        database.ref('users/' + myId).on('value', (snapshot) => {
            const data = snapshot.val();
            document.getElementById('nav-name').innerText = data.name;
            document.getElementById('coin-count').innerText = data.coins;
            document.getElementById('nav-photo').src = data.photo;
            window.userData = data;
        });
        generateGrid();
    }

    // --- GAME ENGINE ---
    function generateGrid() {
        const grid = document.getElementById('grid');
        grid.innerHTML = '';
        let nums = Array.from({length: 75}, (_, i) => i + 1).sort(() => Math.random() - 0.5);
        for(let i=0; i<25; i++) {
            const cell = document.createElement('div');
            cell.className = 'cell';
            cell.innerText = nums[i];
            cell.onclick = () => {
                cell.classList.toggle('marked');
                const val = parseInt(cell.innerText);
                if(cell.classList.contains('marked')) {
                    if(selectedNums.length < 7) selectedNums.push(val);
                    else {
                        cell.classList.remove('marked');
                        alert("You can only pick 7 numbers!");
                    }
                } else {
                    selectedNums = selectedNums.filter(n => n !== val);
                }
            };
            grid.appendChild(cell);
        }
    }

    function drawNumber() {
        if(selectedNums.length === 0) return alert("Pick some numbers first!");
        if(window.userData.coins < 10) return alert("Not enough coins!");

        const ball = Math.floor(Math.random() * 75) + 1;
        let bonus = selectedNums.includes(ball) ? 50 : 0;
        
        database.ref('users/' + myId).update({
            coins: window.userData.coins - 10 + bonus
        });
        
        const statusEl = document.getElementById('status');
        statusEl.innerText = "BALL: " + ball + (bonus > 0 ? " | MATCH! +50" : "");
        
        if(bonus > 0) {
            document.querySelectorAll('.cell').forEach(c => {
                if(parseInt(c.innerText) === ball) c.classList.add('match');
            });
        }
    }
</script>
</body>
</html>
